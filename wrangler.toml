#:schema node_modules/wrangler/config-schema.json

name = "ark-tools"
main = "src/index.ts"
compatibility_date = "2024-10-11"
compatibility_flags = ["nodejs_compat"]

# ─────────────────────────────────────────────────────────────────────
# OBSERVABILITY
# ─────────────────────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
invocation_logs = true

# ─────────────────────────────────────────────────────────────────────
# ASSETS (SPA)
# ─────────────────────────────────────────────────────────────────────
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# ─────────────────────────────────────────────────────────────────────
# BUILD
# ─────────────────────────────────────────────────────────────────────
[build]
command = "pnpm build"
[vars]
ENVIRONMENT = "development"
APP_NAME = "ARK LEDGER"
APP_VERSION = "1.0.0"
APP_URL = "http://localhost:8787"
COMPANY_NAME = "Substrate Holdings LLC"
COMPANY_EMAIL = "pavel@arksystems.site"
SUPPORT_URL = "https://wa.me/525657062511"
AUTH_EMAIL_FROM = "ARK LEDGER <no-reply@mail.arksystems.site>"
SENTINELA_WEBHOOK_SECRET = "ark_sent_live_b7d8e2a149c0f3e6"

# ─────────────────────────────────────────────────────────────────────
# KV NAMESPACE (para historial de cálculos, feature flags)
# ─────────────────────────────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "ARK_TOOLS_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ─────────────────────────────────────────────────────────────────────
# D1 DATABASE (Persistencia multi-tenant SaaS)
# ─────────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "ARK_TOOLS_DB"
database_name = "ark_tools_db"
database_id = "3e53559f-9062-4311-bdc9-f6dd206560a1"
migrations_dir = "migrations"


# ─────────────────────────────────────────────────────────────────────
# WORKERS AI
# ─────────────────────────────────────────────────────────────────────
[ai]
binding = "AI"

# ─────────────────────────────────────────────────────────────────────
# R2 BUCKET (para exportaciones de Excel/PDF generadas)
# ─────────────────────────────────────────────────────────────────────
# [[r2_buckets]]
# binding = "ARK_TOOLS_R2"
# bucket_name = "ark-tools-exports"

# ─────────────────────────────────────────────────────────────────────
# RATE LIMITING (para proteger endpoints de IA o cálculos masivos)
# ─────────────────────────────────────────────────────────────────────
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }

# ─────────────────────────────────────────────────────────────────────
# ENTORNOS
# ─────────────────────────────────────────────────────────────────────
[env.staging]
name = "ark-tools-staging"
vars = { ENVIRONMENT = "staging", APP_URL = "https://staging.ledger.arksystems.site", AUTH_EMAIL_FROM = "ARK LEDGER <no-reply@mail.arksystems.site>", SENTINELA_WEBHOOK_SECRET = "ark_sent_live_b7d8e2a149c0f3e6" }

[env.production]
name = "ark-tools-production"
routes = [
  { pattern = "ledger.arksystems.site", custom_domain = true }
]
vars = { ENVIRONMENT = "production", APP_NAME = "ARK LEDGER", APP_VERSION = "1.0.0", APP_URL = "https://ledger.arksystems.site", COMPANY_NAME = "Substrate Holdings LLC", COMPANY_EMAIL = "pavel@arksystems.site", SUPPORT_URL = "https://wa.me/525657062511", AUTH_EMAIL_FROM = "ARK LEDGER <no-reply@mail.arksystems.site>", SENTINELA_WEBHOOK_SECRET = "ark_sent_live_b7d8e2a149c0f3e6" }

[[env.production.d1_databases]]
binding = "ARK_TOOLS_DB"
database_name = "ark_tools_db"
database_id = "3e53559f-9062-4311-bdc9-f6dd206560a1"
migrations_dir = "migrations"

[env.production.ai]
binding = "AI"

# ─────────────────────────────────────────────────────────────────────
# CRON TRIGGERS (Health check Alegra cada 6 horas)
# ─────────────────────────────────────────────────────────────────────
[triggers]
crons = ["0 */6 * * *"]

